<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head th:replace="~{fragments :: head('Branch')}"></head>
  <body>
    <nav th:replace="~{fragments :: navbar}"></nav>
    <main>
      <div class="describe-container">
        <div class="branch-header">
          <h1 th:text="${branch}"></h1>
          <div class="branch-actions">
            <button type="button" id="save-changes" class="btn btn-save" hidden>Save changes</button>
            <button type="button" id="reset-changes" class="btn btn-reset" hidden>Reset</button>
            <form method="post" th:action="@{/branches/{branch}/approve(branch=${branch})}" class="action-form">
              <button type="submit" class="btn btn-approve">Approve</button>
            </form>
            <form method="post" th:action="@{/branches/{branch}/reject(branch=${branch})}" class="action-form">
              <button type="submit" class="btn btn-reject">Reject</button>
            </form>
          </div>
        </div>
        <div class="branch-subject" th:each="subject : ${subjects}">
          <div class="subject-header">
            <h2
              class="subject-heading"
              contenteditable="plaintext-only"
              spellcheck="false"
              th:text="${subject.name}"
              th:data-uri="${subject.uri}"
              th:data-name="${subject.name}"></h2>
            <button type="button" class="subject-delete" title="Delete all statements for this subject">&times;</button>
          </div>
          <ul class="statement-list">
            <li
              class="statement-item"
              th:each="statement : ${subject.statements}"
              th:classappend="${statement.retracted} ? 'statement-retracted' : 'statement-asserted'"
              th:data-subject="${subject.uri}"
              th:data-predicate="${statement.predicateUri}"
              th:data-object="${statement.object}"
              th:data-literal="${statement.literal}"
              th:data-datatype="${statement.datatype}"
              th:data-language="${statement.language}"
              th:data-retracted="${statement.retracted}">
              <code class="statement-predicate" th:text="${statement.predicate}"></code>
              <code
                class="statement-object"
                th:attr="contenteditable=${statement.retracted} ? null : 'plaintext-only'"
                spellcheck="false"
                th:text="${statement.object}"></code>
              <span class="statement-origin-badge" th:if="${statement.retracted}">removing</span>
              <button
                type="button"
                class="statement-delete"
                th:title="${statement.retracted} ? 'Keep this statement' : 'Delete statement'">&times;</button>
            </li>
          </ul>
        </div>
        <p class="statements-empty" th:if="${subjects.isEmpty()}">
          No statements staged on this branch.
        </p>
      </div>
    </main>
    <script type="module" th:src="@{/js/branch.js}"></script>
  </body>
</html>
